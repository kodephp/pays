name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: Quality gate (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, zip, ctype, json, openssl, tokenizer, dom
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: --prefer-dist --no-interaction

      - name: PHPStan (static analysis, level 8)
        run: composer phpstan

      - name: PHPCS (PSR-12)
        run: composer phpcs

      - name: PHPUnit
        run: composer test

      - name: Benchmark (hot path, informational)
        run: composer bench
